name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: |
          python -m compileall safe
      - name: Secret smoke check
        run: |
          if grep -RniE 'Httpapi1|fassad2209|BOT_TOKEN=|AKUVOX_PASSWORD|BEGIN (RSA|OPENSSH|PRIVATE) KEY' . \
            --exclude-dir=.git \
            --exclude-dir=__pycache__ \
            --exclude=README.md \
            --exclude=AGENT.md; then
            echo "Potential secret found"
            exit 1
          fi
